<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="robots" content="noindex, nofollow">
<script src="/assets/gate.js"></script>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김광섭 교수 교육 서비스</title>
  <meta name="description" content="경민대학교 김광섭 교수의 수업·교육을 위한 웹 서비스 모음">
  <link rel="icon" href="assets/logo-kyungmin.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --brand: #0068b7;
      --brand-soft: #e8f1fa;
      --bg: #f6f8fb;
      --surface: #ffffff;
      --text: #1a2230;
      --muted: #5b6676;
      --line: #e1e6ee;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 16px rgba(16, 24, 40, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --brand: #4da3e8;
        --brand-soft: #16283a;
        --bg: #0f141b;
        --surface: #171e27;
        --text: #e6ebf2;
        --muted: #9aa6b6;
        --line: #283241;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }

    /* Header */
    header { background: var(--surface); border-bottom: 1px solid var(--line); }
    .nav { display: flex; align-items: center; gap: 10px; height: 60px; }
    .nav img { width: 32px; height: 32px; }
    .nav strong { font-size: 15px; }
    .nav span { color: var(--muted); font-size: 13px; }

    /* Hero */
    .hero { padding: 56px 0 40px; }
    .hero .eyebrow {
      display: inline-block; font-size: 13px; font-weight: 600; color: var(--brand);
      background: var(--brand-soft); padding: 4px 10px; border-radius: 999px; margin-bottom: 14px;
    }
    .hero h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.3; letter-spacing: -0.02em; }
    .hero p { margin-top: 12px; color: var(--muted); font-size: 16px; max-width: 600px; }

    /* Services */
    .section-title {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 14px; font-size: 18px;
    }
    .section-title small { color: var(--muted); font-size: 13px; font-weight: 400; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card {
      display: flex; flex-direction: column; gap: 10px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 20px; box-shadow: var(--shadow);
      transition: transform .15s ease, border-color .15s ease;
    }
    a.card:hover { transform: translateY(-2px); border-color: var(--brand); }
    a.card:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
    .card .icon {
      width: 44px; height: 44px; border-radius: 10px; background: var(--brand-soft);
      display: grid; place-items: center; font-size: 22px;
    }
    .card h3 { font-size: 17px; }
    .card p { color: var(--muted); font-size: 14px; flex: 1; }
    .card .meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 12px; color: var(--muted); border: 1px solid var(--line);
      padding: 2px 8px; border-radius: 999px;
    }
    .tag.new { color: var(--brand); border-color: var(--brand); }
    .card.placeholder {
      border-style: dashed; box-shadow: none; background: transparent;
      align-items: center; justify-content: center; text-align: center; min-height: 180px;
    }
    .card.placeholder p { flex: 0; }

    footer {
      margin-top: 64px; padding: 24px 0 40px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <div class="wrap nav">
    <img src="assets/logo-kyungmin.png" alt="경민대학교 로고">
    <strong>경민대학교</strong>
    <span>김광섭 교수</span>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <span class="eyebrow">Education Services</span>
    <h1>김광섭 교수의<br>교육을 위한 서비스</h1>
    <p>경민대학교 수업 설계와 운영, 학습 활동에 활용하는 웹 도구를 모아 둔 공간입니다. 새로운 서비스가 계속 추가됩니다.</p>
  </section>

  <section aria-labelledby="services-title">
    <h2 class="section-title" id="services-title">
      서비스 <small id="service-count"></small>
    </h2>
    <div class="grid" id="service-grid"></div>
  </section>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> 경민대학교 김광섭 · 교육용 서비스</div>
</footer>

<script>
  // 새 서비스 추가 시 이 배열에 항목을 하나 추가하면 됩니다.
  // { icon, title, description, href, tags: [], isNew: true/false }
  const SERVICES = [
    {
      icon: '📄',
      title: '교수설계가이드 작성 툴',
      description: '교과목 정보를 입력하면 교수설계가이드(교수학습지침서)를 실시간 미리보기와 함께 작성하고 PDF·HTML로 내보낼 수 있습니다.',
      href: 'guide-tool/',
      tags: ['수업 설계', '문서 작성'],
      isNew: false
    },
    {
      icon: '📊',
      title: '학과별 입시 경쟁률 분석',
      description: '경민대 5개 학과(지능형소프트웨어·호텔조리·카페베이커리·레포츠·태권도외교)별로 수도권 전문대 동일 계열의 수시 경쟁률과 교육과정을 비교하고, 학교·산업 소식을 정리합니다.',
      href: 'admissions-2026/admissions-dashboard.html',
      tags: ['입시', '2027학년도'],
      isNew: true
    }
  ];

  const grid = document.getElementById('service-grid');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  grid.innerHTML = SERVICES.map(s => `
    <a class="card" href="${esc(s.href)}">
      <div class="icon" aria-hidden="true">${s.icon}</div>
      <h3>${esc(s.title)}</h3>
      <p>${esc(s.description)}</p>
      <div class="meta">
        ${s.isNew ? '<span class="tag new">NEW</span>' : ''}
        ${(s.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
      </div>
    </a>`).join('') + `
    <div class="card placeholder">
      <div class="icon" aria-hidden="true">＋</div>
      <p>새로운 서비스가 준비 중입니다</p>
    </div>`;

  document.getElementById('service-count').textContent = `${SERVICES.length}개`;
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
